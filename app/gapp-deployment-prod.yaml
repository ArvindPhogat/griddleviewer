apiVersion: apps/v1
kind: Deployment
metadata:
  name: gapp
  namespace: prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gapp
  template:
    metadata:
      labels:
        app: gapp
    spec:
      containers:
      - name: gapp
        image: phogatavi88/gradlew:v1.0.5
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: gapp-service
  namespace: prod
spec:
  type: NodePort
  selector:
    app: gapp
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30082
