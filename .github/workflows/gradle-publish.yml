# This workflow builds and tests the project on release creation
# Clean, minimal setup - no caching complexity

name: Gradle Package

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run Gradle build
        run: ./gradlew --no-daemon clean test build
